name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: '分发目标'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install fastlane
        run: bundle install

      - name: Decode App Store Connect API key
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        run: |
          mkdir -p ~/.fastlane
          echo "$KEY_CONTENT" | base64 --decode > ~/.fastlane/AuthKey_${KEY_ID}.p8

      - name: Build and distribute
        env:
          TARGET: ${{ github.event.inputs.target || 'testflight' }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_FILEPATH: ~/.fastlane/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
        run: |
          set -o pipefail
          bundle exec fastlane ios package env:appstore distribute:"$TARGET"
